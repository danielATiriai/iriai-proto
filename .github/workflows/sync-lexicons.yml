name: Sync lexicons

# Resolves the vendored community lexicons from the network (DNS authority,
# then the signed record on the publisher's PDS) and pins their URI and CID in
# lexicons.json. Runs here because Claude's cloud sessions cannot reach the
# Bluesky network. On a pull request from this repository it commits the
# result back to the branch; otherwise it only reports a difference.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - lexicons.json
      - lexicons/community/**
      - lexicons/com/**
      - package-lock.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve vendored lexicons from the network
        run: npx lex install --update
      - name: Check every vendored lexicon is pinned
        run: node scripts/check-lexicons.mjs --require-pins
      - name: Show what changed
        run: git status --short && git diff --stat
      # A commit pushed with the workflow token does not start CI, so the
      # pinned result is validated here before it is committed.
      - name: Validate with the pinned lexicons
        run: npm run validate
      - name: Clean consumer with the pinned lexicons
        run: npm run verify-consumer
      - name: Commit pins to the branch
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- lexicons lexicons.json; then
            echo "Vendored lexicons already match the network."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexicons lexicons.json
          git commit -m "Pin vendored lexicons to their published records"
          git push
